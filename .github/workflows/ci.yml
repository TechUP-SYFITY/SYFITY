name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.husky/**'
              - 'commitlint.config.mjs'
              - '.github/workflows/**'
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.husky/**'
              - 'commitlint.config.mjs'
              - '.github/workflows/**'

  lint-be:
    name: Backend — Lint / Type-check / Test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Generate tsoa routes
        run: pnpm --filter backend generate

      - name: Lint
        run: pnpm --filter backend lint

      - name: Type-check
        run: pnpm --filter backend exec tsc --noEmit

      - name: Test
        run: pnpm --filter backend test

  lint-fe:
    name: Frontend — Lint
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter frontend lint

  build-fe:
    name: Frontend — Build (includes type-check)
    runs-on: ubuntu-latest
    needs: [changes, lint-fe]
    if: >
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') &&
      (needs.lint-fe.result == 'success' || needs.lint-fe.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter frontend build
