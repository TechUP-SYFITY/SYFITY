# Playwright E2E 전용 PostgreSQL.
# 개발용 Supabase 로컬 스택(:54322)과 포트·DB를 분리해, E2E의 truncate가 개발 데이터를 건드리지 않게 한다.
services:
  e2e-db:
    image: postgres:17-alpine
    container_name: syfity-e2e-db
    # 접속값 단일 출처. up 스크립트가 `--env-file`로 넘겨 ${E2E_DB_PORT}까지 채운다.
    env_file:
      - apps/frontend/e2e/.env.e2e
    ports:
      - '${E2E_DB_PORT}:5432'
    # 볼륨을 두지 않아 `docker compose down`으로 데이터가 함께 사라진다.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
