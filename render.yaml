services:
  - type: web
    name: syfity-backend
    env: node
    region: singapore
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter backend exec prisma generate &&
      pnpm --filter backend exec prisma migrate deploy &&
      pnpm --filter backend build
    startCommand: pnpm --filter backend start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VERCEL_PREVIEW_ORIGIN_PATTERN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PROFILE_IMAGE_BUCKET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: HEALTHCHECKS_ROOM_LIFECYCLE_URL
        sync: false
      - key: HEALTHCHECKS_METADATA_REFRESH_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
